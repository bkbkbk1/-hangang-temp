<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Icon Converter</title>
</head>
<body style="text-align: center; padding: 40px; font-family: Arial;">
  <h1>한강 몇도? 아이콘 변환기</h1>

  <div id="preview" style="margin: 20px;">
    <img src="/icon.svg" width="512" height="512" style="border: 1px solid #ccc;">
  </div>

  <button onclick="convertToPNG()" style="padding: 15px 30px; font-size: 18px; cursor: pointer; background: #667eea; color: white; border: none; border-radius: 8px;">
    PNG로 변환 & 다운로드
  </button>

  <canvas id="canvas" width="1024" height="1024" style="display:none;"></canvas>

  <script>
    async function convertToPNG() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      // Load SVG
      const img = new Image();
      img.onload = function() {
        // Draw on canvas
        ctx.drawImage(img, 0, 0, 1024, 1024);

        // Convert to PNG and download
        canvas.toBlob(function(blob) {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'icon.png';
          a.click();
          URL.revokeObjectURL(url);
          alert('icon.png 다운로드 완료! public/ 폴더에 넣으세요!');
        }, 'image/png');
      };

      // Fetch SVG content
      const response = await fetch('/icon.svg');
      const svgText = await response.text();
      const blob = new Blob([svgText], { type: 'image/svg+xml' });
      img.src = URL.createObjectURL(blob);
    }
  </script>

  <p style="margin-top: 30px; color: #666;">
    변환 후 다운로드된 icon.png 파일을<br>
    hangang-temp/public/ 폴더에 저장하세요!
  </p>
</body>
</html>
